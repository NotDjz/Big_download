name: CI

# Every push and pull request: nothing reaches main with a broken test, a broken interface, a known-vulnerable
# dependency, a leaked secret or a free-form commit message.
# No pull_request_target or workflow_run: a fork's code never runs with secrets or write access.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC: a fresh advisory audit of the pinned dependencies
  workflow_dispatch:

# Read-only token for every job; nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Only a PR's superseded runs are cancelled: on main, every merge commit keeps its own verdict (release.yml
  # requires it on the tagged commit), and the weekly audit is never cut short by a push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  tests:
    name: tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # PEP 8 through ruff format, and the lint set ruff.toml selects. First, so that the runtime lock installed
      # next is what the tests run against, even if the two locks ever disagree on a shared package.
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      # Exact versions, each checked by hash: what the release bundles.
      - run: python -m pip install --require-hashes -r requirements.txt
      # The pinned FFmpeg, checked by SHA-256 before extraction: the cut tests run the real one.
      - run: python download_ffmpeg.py
      # Offline: the --online sections reach YouTube, which a CI runner cannot be trusted to.
      - run: python tests/server_tests.py

  ui:
    name: ui
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Node 22+: the smoke test drives Chrome over CDP with the global WebSocket.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python download_ffmpeg.py
      # The smoke test needs a file in the library, and a cut long enough to be stopped mid-way.
      - run: |
          New-Item -ItemType Directory -Force downloads/Videos | Out-Null
          ./ffmpeg.exe -v error -f lavfi -i testsrc=size=1280x720:rate=30 -t 40 -c:v libx264 -preset ultrafast downloads/Videos/sample.mp4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - run: python tests/run_ui_smoke.py

  # The installer's whole life on a disposable runner (thrown away after): install, a real cut through the installed
  # app, upgrade with the app running, relaunch, uninstall while running. Per user, so no admin is involved.
  msi:
    name: msi
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHON: python # build.bat: the interpreter setup-python installed, not whatever `py` finds
      LIFE: ${{ github.workspace }}\lifecycle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python download_ffmpeg.py
      - run: ./scripts/install-wix.ps1
      - run: ./build-msi.ps1 -Version 0.0.1
      # A second build of the same version has a new package code: installed over the first, it is an upgrade.
      - run: ./tests/msi/upgrade-pair.ps1 -Out $env:RUNNER_TEMP
      - run: |
          ./ffmpeg.exe -v error -f lavfi -i testsrc=size=640x360:rate=30 -f lavfi -i sine -t 3 -c:v libx264 -preset ultrafast -c:a aac -shortest "$env:RUNNER_TEMP\sample.mp4"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # One step per phase, each shorter than the job: a hang fails its own step and keeps its log.
      - name: lifecycle install
        timeout-minutes: 6
        run: ./tests/msi/lifecycle.ps1 -Phase install -Old "$env:RUNNER_TEMP\old.msi" -New "$env:RUNNER_TEMP\new.msi" -Out $env:LIFE
      - name: lifecycle start and cut
        timeout-minutes: 5
        run: ./tests/msi/lifecycle.ps1 -Phase start -Old "$env:RUNNER_TEMP\old.msi" -New "$env:RUNNER_TEMP\new.msi" -Sample "$env:RUNNER_TEMP\sample.mp4" -Out $env:LIFE
      - name: lifecycle upgrade with the app running
        timeout-minutes: 6
        run: ./tests/msi/lifecycle.ps1 -Phase upgrade -Old "$env:RUNNER_TEMP\old.msi" -New "$env:RUNNER_TEMP\new.msi" -Out $env:LIFE
      - name: lifecycle relaunch
        timeout-minutes: 3
        run: ./tests/msi/lifecycle.ps1 -Phase relaunch -Old "$env:RUNNER_TEMP\old.msi" -New "$env:RUNNER_TEMP\new.msi" -Out $env:LIFE
      - name: lifecycle uninstall while running
        timeout-minutes: 6
        run: ./tests/msi/lifecycle.ps1 -Phase uninstall -Old "$env:RUNNER_TEMP\old.msi" -New "$env:RUNNER_TEMP\new.msi" -Out $env:LIFE
      - name: lifecycle report
        timeout-minutes: 2
        run: ./tests/msi/lifecycle.ps1 -Phase report -Old "$env:RUNNER_TEMP\old.msi" -New "$env:RUNNER_TEMP\new.msi" -Out $env:LIFE
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-lifecycle
          path: ${{ env.LIFE }}
          if-no-files-found: ignore

  audit:
    name: audit
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      # The lock holds everything the exe is made of, PyInstaller included. --strict fails on any package that
      # could not be audited instead of skipping it.
      - run: python -m pip_audit --strict --disable-pip --require-hashes -r requirements.txt

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      # The whole history: a secret removed by a later commit is still in the earlier ones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks pinned by version and by the SHA-256 GitHub publishes for the asset.
      - run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .

  commits:
    name: commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Conventional Commits for every commit this push or pull request brings. Earlier history predates the rule.
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ -z "${BASE//0/}" ]; then echo "No range to check."; exit 0; fi
          # Otherwise git log fails inside the process substitution, the loop reads nothing and the job passes.
          git rev-parse --verify --quiet "$BASE^{commit}" > /dev/null || { echo "::error::Base $BASE is not in the history"; exit 1; }
          bad=0
          while IFS= read -r subject; do
            if ! printf '%s' "$subject" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9 ._/-]+\))?!?: .+'; then
              echo "::error::Not a Conventional Commit: $subject"; bad=1
            fi
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          exit $bad
