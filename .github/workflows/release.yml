name: Release

# A v* tag on a commit of main whose CI passed in full: the exe and the MSI built once, their provenance attested
# (SLSA), then published only after the owner approves the `release` environment. What was tested and attested is
# what is published; nothing is rebuilt.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  # A tag can be pushed on any commit. Only one that is on main and passed every CI job (tests, ui, audit, secrets,
  # commits) may become a release: the server tests below alone would let a broken interface or a vulnerable
  # dependency through.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --event push \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          [ "$green" -gt 0 ] || { echo "::error::No successful CI run on main for $SHA"; exit 1; }

  build:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # provenance signing (OIDC), this job only
      attestations: write
    outputs:
      msi: ${{ steps.version.outputs.msi }}
    env:
      PYTHON: python # build.bat: the interpreter setup-python installed, not whatever `py` finds
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The version comes from the tag, and the tag must have its CHANGELOG.md section: those are the notes.
      - id: version
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag $env:GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH" }
          $changelog = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\].*?(?=^## |\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "msi=BigDownloader-$version-x64.msi" >> $env:GITHUB_OUTPUT
          Set-Content notes.md $m.Value.Trim()
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python download_ffmpeg.py
      - run: python tests/server_tests.py
      # WiX checked against nuget.org's published SHA-512 before use.
      - run: ./scripts/install-wix.ps1
      - run: ./build-msi.ps1 -Version ${{ steps.version.outputs.version }}
      # The MSI about to be published goes through its whole life on this disposable runner first (ci.yml runs the
      # same script phase by phase on every change).
      - run: |
          ./tests/msi/upgrade-pair.ps1 -Out $env:RUNNER_TEMP
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./ffmpeg.exe -v error -f lavfi -i testsrc=size=640x360:rate=30 -f lavfi -i sine -t 3 -c:v libx264 -preset ultrafast -c:a aac -shortest "$env:RUNNER_TEMP\sample.mp4"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: MSI lifecycle
        timeout-minutes: 20
        run: ./tests/msi/lifecycle.ps1 -Phase all -Old "$env:RUNNER_TEMP\old.msi" -New "$env:RUNNER_TEMP\new.msi" -Sample "$env:RUNNER_TEMP\sample.mp4" -Out "$env:RUNNER_TEMP\lifecycle"
      - env:
          MSI: ${{ steps.version.outputs.msi }}
        run: |
          $ffmpeg = python -c "import download_ffmpeg; print(download_ffmpeg.VERSION)"
          $lines = foreach ($f in "dist\BigDownloader.exe", "dist\$env:MSI") {
            "- ``$(Split-Path $f -Leaf)``: SHA-256 ``$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())``"
          }
          Add-Content notes.md ("`n`nBundles FFmpeg $ffmpeg (gyan.dev essentials build, GPL v3), unmodified. " +
            "Built by GitHub Actions from this tag; verify with ``gh attestation verify <file> -R $env:GITHUB_REPOSITORY``.`n`n" +
            ($lines -join "`n"))
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/BigDownloader.exe
            dist/${{ steps.version.outputs.msi }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/BigDownloader.exe
            dist/${{ steps.version.outputs.msi }}
            notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Approved by the owner in GitHub before it runs (Settings > Environments > release).
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      # Not a prerelease: the README links to the latest release's exe and MSI.
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MSI: ${{ needs.build.outputs.msi }}
        run: |
          # upload-artifact kept the paths below their common root: dist/ for the binaries, notes.md at the top.
          gh release create "$GITHUB_REF_NAME" dist/BigDownloader.exe "dist/$MSI" --repo "$GITHUB_REPOSITORY" \
            --title "BIG DL $GITHUB_REF_NAME" --verify-tag --notes-file notes.md
