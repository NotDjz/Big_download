# Pinned versions only stay safe if something moves them: yt-dlp above all, which is frozen into the exe and starts
# getting 403s as soon as a platform tightens its protections. Each bump arrives as a PR and goes through the CI.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message: # build(deps): bump ...: the commits check requires Conventional Commits
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message: # build(deps): bump ...: the commits check requires Conventional Commits
      prefix: build
      include: scope
